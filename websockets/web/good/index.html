<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>app</title>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
         max-width: 780px; margin: 2rem auto; padding: 0 1rem; }
  h2 { color: #0a7; margin-bottom: .2rem; }
  .origin { color: #666; margin-top: 0; }
  label { display: inline-block; width: 4.5rem; }
  input { font: inherit; padding: .25rem .4rem; }
  #ticket { width: 30rem; }
  button { font: inherit; padding: .35rem .8rem; cursor: pointer; margin-right: .4rem; }
  pre { background: #f4f4f4; padding: .8rem; border-radius: 4px;
        white-space: pre-wrap; word-break: break-all; min-height: 8rem; }
  .row { margin: .5rem 0; }
</style>
</head>
<body>

<h2>the real app</h2>
<p class="origin">origin: <b id="origin"></b> &mdash; this one is in ALLOWED_ORIGINS</p>

<div class="row">
  <label>user</label><input id="user" value="alice" size="12">
  <label>doc</label><input id="doc" value="doc-a" size="12">
</div>

<div class="row">
  <button onclick="mint()">1. mint ticket</button>
  <button onclick="connect()">2. connect</button>
  <button onclick="mintAndConnect()">do both</button>
  <button onclick="clearLog()">clear</button>
</div>

<div class="row">
  <label>ticket</label><input id="ticket" placeholder="(mint one, then copy this into the evil page)">
</div>

<pre id="log"></pre>

<script>
const API = "http://localhost:8000";
const WS  = "ws://localhost:8000";

document.getElementById("origin").textContent = location.origin;

const logEl = document.getElementById("log");
const log = (m) => {
  const t = new Date().toISOString().slice(11, 23);
  logEl.textContent += `${t}  ${m}\n`;
  logEl.scrollTop = logEl.scrollHeight;
};
const clearLog = () => { logEl.textContent = ""; };

const userEl   = document.getElementById("user");
const docEl    = document.getElementById("doc");
const ticketEl = document.getElementById("ticket");

async function mint() {
  const user = userEl.value.trim();
  log(`POST /ws-ticket  (X-User-Id: ${user})`);
  try {
    const r = await fetch(API + "/ws-ticket", {
      method: "POST",
      headers: { "X-User-Id": user },
    });
    if (!r.ok) { log(`  -> HTTP ${r.status}`); return null; }
    const data = await r.json();
    ticketEl.value = data.ticket;
    log(`  -> ticket ${data.ticket.slice(0, 16)}...  expires_in=${data.expires_in}s`);
    log("  (copy the ticket field into the evil page to attack with it)");
    return data.ticket;
  } catch (e) {
    log("  -> fetch failed: " + e);
    log("  (if this is a CORS error, add CORSMiddleware to main.py)");
    return null;
  }
}

function connect(ticket) {
  ticket = typeof ticket === "string" ? ticket : ticketEl.value.trim();
  const doc = docEl.value.trim();
  if (!ticket) { log("no ticket -- mint one first"); return; }

  const url = `${WS}/ws/doc/${doc}?ticket=${encodeURIComponent(ticket)}`;
  log(`WS connect ${doc}  ticket=${ticket.slice(0, 12)}...`);

  const ws = new WebSocket(url);
  ws.onopen = () => {
    log("  -> OPEN");
    ws.send("hello from the real app");
  };
  ws.onmessage = (e) => log("  <- " + e.data);
  ws.onerror   = ()  => log("  -> error (browsers give no detail here, by design)");
  ws.onclose   = (e) =>
    log(`  -> CLOSED code=${e.code} reason=${e.reason || "(empty)"} clean=${e.wasClean}`);
}

async function mintAndConnect() {
  const t = await mint();
  if (t) connect(t);
}
</script>

</body>
</html>
